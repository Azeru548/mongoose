[workspace]
members = [
  "programs/missing_signer",
  "programs/missing_signer_secure",
  "programs/missing_owner",
  "programs/type_cosplay",
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Pin toml ecosystem to pre-edition2024 for Solana 1.18 (Cargo 1.75)
[patch.crates-io]
toml = "=0.8.19"
toml_datetime = "=0.6.11"
toml_edit = "=0.22.27"
toml_parser = "=0.1.3"
winnow = "=0.6.18"
